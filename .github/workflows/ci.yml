name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: parser matches grammar
        run: npm run check-generated
      - name: corpus tests
        run: npm test
      - name: parse fixtures
        run: npm run check
